version: '3.8'

services:
  # ─── Development ────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "5000:5000"
    volumes:
      - ./:/app
      - /app/node_modules

  # ─── Production ─────────────────────────────────────────────
  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      # Server-side: tells the Next.js rewrite where to forward /api/* calls
      # Change this to wherever your backend runs:
      #   Windows/Mac Docker Desktop → http://host.docker.internal:3001
      #   Linux Docker               → http://172.17.0.1:3001
      #   Backend in same Compose    → http://backend-service-name:3001
      - BACKEND_URL=http://host.docker.internal:3001
    ports:
      - "3001:5001"
