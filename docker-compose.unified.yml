version: '3.8'

services:
  # ─── DEVELOPMENT SERVICES ────────────────────────────────────────────────────
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alms-backend-dev
    restart: unless-stopped
    env_file:
      - ./.env.dev
    environment:
      NODE_ENV: development
      PORT: 3000
    ports:
      - "3000:3000"  # Expose for system nginx access
    volumes:
      - ./backend/src:/app/src  # Hot reload for development
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - alms-unified-net

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000/api
    container_name: alms-frontend-dev
    restart: unless-stopped
    env_file:
      - ./.env.dev
    environment:
      NEXT_PUBLIC_API_URL: https://dev.alms.sparquer.com/api
      NODE_ENV: development
      PORT: 5000
    ports:
      - "5000:5000"  # Expose for system nginx access
    volumes:
      - ./frontend/src:/app/src  # Hot reload for development
      - ./frontend/pages:/app/pages
    depends_on:
      backend-dev:
        condition: service_healthy
    networks:
      - alms-unified-net

  # ─── PRODUCTION SERVICES ─────────────────────────────────────────────────────
  backend-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: alms-backend-prod
    restart: unless-stopped
    env_file:
      - ./.env.prod
    environment:
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"  # Expose for system nginx access
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 45s
      timeout: 15s
      retries: 5
      start_period: 120s
    networks:
      - alms-unified-net
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        BACKEND_URL: ${BACKEND_URL:-http://backend-prod:3001}
        NODE_ENV: production
    container_name: alms-frontend-prod
    restart: unless-stopped
    env_file:
      - ./.env.prod
    environment:
      NEXT_PUBLIC_API_URL: https://prod.alms.sparquer.com/api
      BACKEND_URL: http://backend-prod:3001
      PORT: 5001
      JWT_SECRET: 3097adb9893605ecbca993d05142aef1d4a92cd44f6ece72f32750f6697b82555d2634fa846a2ae78c2465d637b04568244fefaaf5e5f3514b92f357e43111d7
      DATABASE_URL: postgresql://alms:rI1VQZgWmRN6msBORF8f@almsdev.cta888eqmcrq.ap-south-1.rds.amazonaws.com:5432/alms_prod?connection_limit=20&pool_timeout=20&connect_timeout=10&socket_timeout=30

    ports:
      - "5001:5001"  # Expose for system nginx access
    depends_on:
      backend-prod:
        condition: service_healthy
    networks:
      - alms-unified-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=3", "--spider", "http://localhost:5001/"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
# ─── UNIFIED NETWORK ──────────────────────────────────────────────────────────
networks:
  alms-unified-net:
    name: alms-unified-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
