services:
  # ─── PRODUCTION SERVICES ─────────────────────────────────────────────────────
  backend-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: alms-backend-prod
    restart: unless-stopped
    env_file:
      - ./.env.prod
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://alms:rI1VQZgWmRN6msBORF8f@db:5432/alms?connection_limit=20&pool_timeout=20&connect_timeout=10&socket_timeout=30
    depends_on:
      - db
    ports:
      - "3001:3001"  # Expose for system nginx access
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 45s
      timeout: 15s
      retries: 5
      start_period: 120s
    networks:
      - alms-unified-net
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # BACKEND_URL must be the bare origin - the Next.js rewrite appends /api/:path* itself
        BACKEND_URL: ${BACKEND_URL:-http://backend-prod:3001}
        # /api = same-origin: the browser calls the frontend, which proxies to the backend
        NEXT_PUBLIC_API_URL: /api
        NODE_ENV: production
    container_name: alms-frontend-prod
    restart: unless-stopped
    env_file:
      - ./.env.prod
    environment:
      NEXT_PUBLIC_API_URL: /api
      BACKEND_URL: http://backend-prod:3001
      HOSTNAME: 0.0.0.0
      PORT: 5001
      JWT_SECRET: 3097adb9893605ecbca993d05142aef1d4a92cd44f6ece72f32750f6697b82555d2634fa846a2ae78c2465d637b04568244fefaaf5e5f3514b92f357e43111d7
      DATABASE_URL: postgresql://alms:rI1VQZgWmRN6msBORF8f@db:5432/alms?connection_limit=20&pool_timeout=20&connect_timeout=10&socket_timeout=30

    ports:
      - "5001:5001"  # Expose for system nginx access
    depends_on:
      backend-prod:
        condition: service_healthy
    networks:
      - alms-unified-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=3", "--spider", "http://backend-prod:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
  db:
    image: postgres:17-alpine
    container_name: alms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: alms
      POSTGRES_PASSWORD: rI1VQZgWmRN6msBORF8f
      POSTGRES_DB: alms
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - alms_pgdata:/var/lib/postgresql/data
    networks:
      - alms-unified-net

# ─── UNIFIED NETWORK ──────────────────────────────────────────────────────────
networks:
  alms-unified-net:
    name: alms-unified-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  alms_pgdata:
    name: alms_pgdata
